<div class="notif">
  <button class="icon-btn" id="notifBtn" aria-label="Уведомления">
    <svg class="icon"><use href="#i-bell"/></svg>
    {% if notif_count %}<span class="notif-dot">{{ notif_count }}</span>{% endif %}
  </button>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-head"><span>Уведомления</span>{% if notif_count %}<span class="notif-new-count">{{ notif_count }} новых</span>{% endif %}</div>
    {% if notifications %}
      {% for n in notifications %}
      <a class="notif-item {{ 'read' if n.read }}" href="{{ n.url }}">
        <span class="notif-tbody"><span class="notif-title">{{ n.title }}</span><span class="notif-meta">{{ n.meta }}</span></span>
        {% if not n.read %}<span class="notif-unread" aria-label="Непрочитано"></span>{% endif %}
      </a>
      {% endfor %}
    {% else %}
      <div class="notif-empty">Пока нет уведомлений</div>
    {% endif %}
  </div>
</div>
