<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAR — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#DABDFF;--accent-soft:#DABDFF;--text:#1A1D21;--text-2:#6B7178;--text-3:#9AA0A6;--border-2:#E3E6EA;--bg:#F4F6F8;--r-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{background:#fff;border:1px solid var(--border-2);border-radius:20px;box-shadow:0 12px 44px rgba(16,24,40,.10);padding:38px 36px;width:100%;max-width:400px}
.auth-brand{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#000000;margin-bottom:14px}
.auth-card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.auth-card .sub{color:var(--text-2);font-size:14px;margin-bottom:24px}
.auth-flash{padding:11px 15px;border-radius:10px;font-size:14px;font-weight:500;margin-bottom:16px;background:#FDECEA;color:#B23A2A;border:1px solid #F6D2CC}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.auth-field input{width:100%;border:1px solid var(--border-2);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:15px;color:var(--text)}
.auth-field input:focus{outline:none;border-color:var(--accent)}
.auth-btn{width:100%;background:#DABDFF;color:#000000;border:none;border-radius:var(--r-sm);padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:filter .15s ease}
.auth-btn:hover{filter:brightness(1.06)}
.auth-alt{text-align:center;margin-top:20px;font-size:14px;color:var(--text-2)}
.auth-alt a{color:#DABDFF;font-weight:600;text-decoration:none}
.auth-alt a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">DAR</div>
  {% with msgs = get_flashed_messages() %}{% if msgs %}{% for m in msgs %}<div class="auth-flash">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
  {% block auth %}{% endblock %}
</div>
</body>
</html>
